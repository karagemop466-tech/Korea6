name: Refresh official MLB snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refresh_mlb.py
      - uses: actions/upload-artifact@v4
        with:
          name: official-mlb
          path: site/data/mlb-*.json
