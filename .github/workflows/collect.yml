name: Collect official schedules
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refresh.py
      - run: python scripts/nfl.py
      - name: Save official snapshot on session branch
        if: github.ref == 'refs/heads/arena/d6dba19e-korea6'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "data: refresh official MLB snapshot"
          git pull --rebase origin arena/d6dba19e-korea6
          git push origin HEAD:arena/d6dba19e-korea6
      - uses: actions/upload-artifact@v4
        with:
          name: official-data
          path: site/data/
